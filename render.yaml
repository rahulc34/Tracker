# Render Blueprint — one Web Service (Next.js + Express API in one repo).
# https://render.com/docs/blueprint-spec
#
# Deploy: Dashboard → New → Blueprint → connect this repo.
# Set secret env vars when prompted (see RENDER.md).

envVarGroups:
  - name: tracker-secrets
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false

services:
  - type: web
    name: tracker
    runtime: node
    plan: free
    branch: main
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /health
    envVars:
      - fromGroup: tracker-secrets
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: AUTH_DISABLED
        value: "false"
      - key: TRACKER_PROXY_API
        value: "true"
      - key: TRACKER_API_PORT
        value: "4001"
      - key: NEXT_PUBLIC_TRACKER_PROXY_API
        value: "true"
